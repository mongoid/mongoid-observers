inherit_from: ".rubocop_todo.yml"

plugins:
- rubocop-md
- rubocop-prose
- rubocop-rake
- rubocop-spellcheck
- rubocop-yaml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  inherit_mode:
    merge:
    - Include
  Include:
  - ".github/**/*.yml"
  - ".rubocop.yml"
  Exclude:
  - coverage/**/*
  - pkg/**/*
  - vendor/**/*

YAML/Lint/InvalidSyntax:
  Include:
  - "**/*.yml"
  - "**/*.yaml"
  inherit_mode:
    merge:
    - Exclude

YAML/Lint/DuplicateKey:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

Naming/FileName:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"
  - ".github/workflows/*.yml"
  - lib/mongoid-observers.rb

Metrics/MethodLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Metrics/AbcSize:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Naming/HeredocDelimiterNaming:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/SafeNavigation:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/OneClassPerFile:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/Documentation:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/UselessAssignment:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/MultilineBlockChain:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Style/SymbolProc:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Lint/Void:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"

Metrics/BlockLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - 'spec/release/release_spec.rb'
  - Gemfile

Layout/LineLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - ".github/workflows/*.yml"

Markdown/HeadingCapitalization:
  Enabled: true
  Style: title_case

Prose/MaxLength:
  Max: false
  Exclude:
  - LICENSE.txt

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"

Spellcheck/Spelling:
  Exclude:
  - LICENSE.txt
