name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Mongoid ${{ matrix.mongoid }} / MongoDB ${{ matrix.mongodb }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: '2.7', mongoid: '4', rails: '4.2', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '5', rails: '4.2', mongodb: '4.4' }
          - { ruby: '2.7', mongoid: '6', rails: '5.2', mongodb: '4.4' }
          - { ruby: '3.1', mongoid: '7', rails: '6.1', mongodb: '4.4' }
          - { ruby: '3.2', mongoid: '8', rails: '7.2', mongodb: '6.0' }
          - { ruby: '3.3', mongoid: '9', rails: '8.1', mongodb: '7.0' }
          - { ruby: '3.4', mongoid: '9', rails: '8.1', mongodb: '8.0' }
          - { ruby: '4.0', mongoid: '9', rails: '8.1', mongodb: '9.0', coverage: true }
    env:
      BUNDLE_GEMFILE: gemfiles/mongoid_${{ matrix.mongoid }}.gemfile
      COVERAGE: ${{ matrix.coverage }}
    services:
      mongo:
        image: mongo:${{ matrix.mongodb }}
        ports: ["27017:27017"]
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: |
          bundle exec ruby -Ilib -e 'require "mongoid-observers"; puts "Mongoid #{Mongoid::VERSION}"'
          bundle exec rake
      - name: Report coverage to Coveralls
        if: matrix.coverage
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/.resultset.json
          format: simplecov
